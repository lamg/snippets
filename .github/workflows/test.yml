name: tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false

      - name: Run tests
        run: |
          lake build snippets-tests
          .lake/build/bin/snippets-tests
